name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test count data, network recovery, and operating hours
        run: node --test tests/*.test.mjs
      - name: Check TypeScript
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build website
        run: npm run build

  macos:
    name: Build universal Mac app
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile Apple silicon and Intel app
        run: bash macos/build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "macos/BFit Pulse.app" BFit-Pulse-Mac-ci.zip
      - uses: actions/upload-artifact@v7
        with:
          name: BFit-Pulse-Mac-universal
          path: BFit-Pulse-Mac-ci.zip
          if-no-files-found: error
          retention-days: 7
